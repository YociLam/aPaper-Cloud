<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aPaper Cloud</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: min(34rem, calc(100vw - 3rem));
      }

      .title {
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }

      .title img {
        width: clamp(2.5rem, 6vw, 3.25rem);
        height: clamp(2.5rem, 6vw, 3.25rem);
        border-radius: 0.75rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0.75rem 0 1.75rem;
        color: color-mix(in srgb, CanvasText 62%, transparent);
      }

      section + section {
        margin-top: 1.75rem;
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.6rem 1rem;
        margin: 0;
        padding-top: 1.25rem;
        border-top: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        font-size: 0.875rem;
      }

      dt {
        color: color-mix(in srgb, CanvasText 52%, transparent);
      }

      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }

      footer {
        display: flex;
        gap: 0.75rem;
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        font-size: 0.875rem;
      }

      footer span {
        color: color-mix(in srgb, CanvasText 52%, transparent);
      }

      footer a {
        color: inherit;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="title">
        <img src="/assets/apaper-mark.png" width="126" height="126" alt="aPaper logo">
        <h1>aPaper Cloud</h1>
      </div>
      <p>Versioned public metadata for aPaper.</p>
      <section aria-labelledby="conference-heading">
        <h2 id="conference-heading">Conference catalog</h2>
        <dl aria-label="Conference catalog status">
          <dt>Manifest</dt>
          <dd id="conference-version">Checking…</dd>
          <dt>Updated</dt>
          <dd><time id="conference-updated">Checking…</time></dd>
        </dl>
      </section>
      <section aria-labelledby="translation-heading">
        <h2 id="translation-heading">Translation Engine</h2>
        <dl aria-label="Translation Engine status">
          <dt>Translator</dt>
          <dd id="translator-version">Checking…</dd>
          <dt>Environment</dt>
          <dd id="environment-version">Checking…</dd>
          <dt>Updated</dt>
          <dd><time id="translation-updated">Checking…</time></dd>
        </dl>
      </section>
      <footer>
        <span>Contact</span>
        <a href="mailto:contact@apaper.ai">contact@apaper.ai</a>
      </footer>
    </main>
    <script>
      function displayTime(element, value) {
        const updatedAt = new Date(value);
        if (Number.isNaN(updatedAt.getTime())) {
          element.textContent = value || "Unavailable";
          return;
        }
        element.dateTime = value;
        element.textContent = new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "medium",
        }).format(updatedAt);
      }

      const conferenceVersion = document.querySelector("#conference-version");
      const conferenceUpdated = document.querySelector("#conference-updated");

      fetch(`/v1/conferences/version.json?check=${Date.now()}`, { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((release) => {
          conferenceVersion.textContent = `v${release.manifest_version}`;
          displayTime(conferenceUpdated, release.updated_at);
        })
        .catch(() => {
          conferenceVersion.textContent = "Unavailable";
          conferenceUpdated.textContent = "Unavailable";
        });

      const translatorVersion = document.querySelector("#translator-version");
      const environmentVersion = document.querySelector("#environment-version");
      const translationUpdated = document.querySelector("#translation-updated");

      fetch(`/v1/translation/version.json?check=${Date.now()}`, { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((release) => {
          translatorVersion.textContent = release.translator_version;
          environmentVersion.textContent = release.environment_version;
          displayTime(translationUpdated, release.updated_at);
        })
        .catch(() => {
          translatorVersion.textContent = "Unavailable";
          environmentVersion.textContent = "Unavailable";
          translationUpdated.textContent = "Unavailable";
        });
    </script>
  </body>
</html>
